<title>Flores Amarillas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#0f3b34;--bg2:#17594d;--yellow:#ffc82e;--ink:#fff8dc;--ground:#0b2b26}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 30%,var(--bg2),var(--bg));color:var(--ink);font-family:Nunito,system-ui,sans-serif;padding-inline:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
h1{font:400 clamp(28px,8vw,44px)/1.05 "DM Serif Display",Georgia,serif;margin:0;text-align:center;text-wrap:balance}
h1 em{color:var(--yellow)}
button.scene{all:unset;cursor:pointer;display:block;width:min(100%,420px);margin-top:8px;-webkit-tap-highlight-color:transparent}
button.scene:focus-visible{outline:3px solid var(--yellow);outline-offset:4px;border-radius:16px}
svg{width:100%;height:auto;display:block;overflow:visible}
.msg{min-height:3.2em;text-align:center;font-weight:800;letter-spacing:.04em;font-size:15px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.msg .a{opacity:1;transition:opacity .4s}.msg .b{opacity:0;transition:opacity .6s .9s;font:400 24px "DM Serif Display",serif;color:var(--yellow);letter-spacing:0}
.msg{position:relative}.msg span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.open~.msg .a,.msg.on .a{opacity:0}.msg.on .b{opacity:1}
#bq{transform:translate(172px,275px);transition:transform 1.1s cubic-bezier(.5,0,.2,1) .15s}
.on-scene #bq{transform:translate(238px,275px)}
#giveArm{transform-origin:128px 275px;transition:transform 1.1s cubic-bezier(.5,0,.2,1) .15s}
.on-scene #giveArm{transform:scaleX(2.5)}
.fl{transform:scale(.35);transition:transform .8s cubic-bezier(.3,1.7,.5,1) var(--d)}
.on-scene .fl{transform:scale(1)}
.on-scene .smile{opacity:0}.big{opacity:0;transition:opacity .4s 1.2s}.on-scene .big{opacity:1}
.blush{opacity:.35;transition:opacity .6s 1.2s}.on-scene .blush{opacity:.8}
.p{position:fixed;top:-20px;width:12px;height:18px;border-radius:50%;background:var(--yellow);pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){#bq,#giveArm,.fl{transition-duration:.01s;transition-delay:0s}.p{display:none}}
</style>

<h1>Feliz día de las <em>flores amarillas</em></h1>
<button class="scene" id="scene" aria-label="Toca para entregar el ramo de flores amarillas">
<svg viewBox="0 0 400 470" role="img" aria-label="Un hombre con lentes entrega un ramo de flores amarillas a una mujer">
<defs>
 <g id="flower">
  <g fill="#ffc82e" stroke="#e39b00" stroke-width="1.2">
   <ellipse cx="0" cy="-11" rx="5.5" ry="10"/><ellipse cx="0" cy="-11" rx="5.5" ry="10" transform="rotate(45)"/>
   <ellipse cx="0" cy="-11" rx="5.5" ry="10" transform="rotate(90)"/><ellipse cx="0" cy="-11" rx="5.5" ry="10" transform="rotate(135)"/>
   <ellipse cx="0" cy="-11" rx="5.5" ry="10" transform="rotate(180)"/><ellipse cx="0" cy="-11" rx="5.5" ry="10" transform="rotate(225)"/>
   <ellipse cx="0" cy="-11" rx="5.5" ry="10" transform="rotate(270)"/><ellipse cx="0" cy="-11" rx="5.5" ry="10" transform="rotate(315)"/>
  </g>
  <circle r="6" fill="#8a4b12"/><circle r="2.4" fill="#c97b1c" cx="-1.5" cy="-1.5"/>
 </g>
</defs>
<!-- suelo -->
<ellipse cx="200" cy="440" rx="190" ry="16" fill="#0b2b26"/>

<!-- MUJER -->
<g>
 <path d="M262 175c-30 0-42 30-40 90 2 50 8 80 20 90h116c12-10 18-40 20-90 2-60-10-90-40-90z" fill="#0c0c10"/>
 <path d="M268 285h64l32 150h-128z" fill="#f2a63b"/>
 <path d="M268 285h64l32 150h-128z" fill="none"/>
 <rect x="276" y="270" width="48" height="30" rx="10" fill="#f2a63b"/>
 <rect x="292" y="238" width="16" height="30" fill="#f0cfb2"/>
 <circle cx="300" cy="200" r="34" fill="#f0cfb2"/>
 <path d="M266 200c-4-40 22-52 40-50 22 2 32 20 28 50-8-22-22-30-40-30-14 0-24 10-28 30z" fill="#0c0c10"/>
 <circle cx="288" cy="204" r="3.2" fill="#1a1010"/><circle cx="312" cy="204" r="3.2" fill="#1a1010"/>
 <circle class="blush" cx="280" cy="216" r="6" fill="#f08a8a"/><circle class="blush" cx="320" cy="216" r="6" fill="#f08a8a"/>
 <path class="smile" d="M291 220q9 6 18 0" stroke="#8a2f2f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <path class="big" d="M289 218q11 13 22 0z" fill="#8a2f2f"/>
 <path d="M270 285l-30 35" stroke="#f0cfb2" stroke-width="13" stroke-linecap="round"/>
 <path d="M240 320l-12-12" stroke="#f0cfb2" stroke-width="13" stroke-linecap="round" opacity="0"/>
 <rect x="270" y="431" width="18" height="10" rx="4" fill="#2a1a12"/><rect x="312" y="431" width="18" height="10" rx="4" fill="#2a1a12"/>
</g>

<!-- HOMBRE -->
<g>
 <rect x="84" y="330" width="22" height="105" rx="8" fill="#2c3550"/><rect x="112" y="330" width="22" height="105" rx="8" fill="#2c3550"/>
 <rect x="80" y="431" width="28" height="11" rx="5" fill="#181818"/><rect x="110" y="431" width="28" height="11" rx="5" fill="#181818"/>
 <path d="M70 290c0-16 12-24 38-24h22c26 0 38 8 38 24v56H70z" fill="#3a86c8" transform="translate(-20 0) scale(1 1)"/>
 <rect x="94" y="232" width="26" height="30" fill="#9a6238" transform="translate(-1 0)"/>
 <circle cx="107" cy="200" r="35" fill="#a8693f"/>
 <path d="M72 200c-6-46 24-58 40-56 26 2 36 22 30 56-6-22-18-30-36-30-16 0-28 10-34 30z" fill="#0a0a0a"/>
 <circle cx="94" cy="204" r="10" fill="#fff" fill-opacity=".25" stroke="#111" stroke-width="3"/>
 <circle cx="122" cy="204" r="10" fill="#fff" fill-opacity=".25" stroke="#111" stroke-width="3"/>
 <path d="M104 203h8" stroke="#111" stroke-width="3"/>
 <circle cx="94" cy="204" r="2.8" fill="#111"/><circle cx="122" cy="204" r="2.8" fill="#111"/>
 <path d="M97 224q10 8 20 0" stroke="#4a1f10" stroke-width="2.6" fill="none" stroke-linecap="round"/>
 <!-- brazo -->
 <g id="giveArm"><line x1="128" y1="275" x2="172" y2="275" stroke="#3a86c8" stroke-width="15" stroke-linecap="round"/></g>
</g>

<!-- RAMO -->
<g id="bq">
 <path d="M-4 20l-14-66M4 20l14-66M0 20V-50" stroke="#2f8f3a" stroke-width="4" stroke-linecap="round"/>
 <g transform="translate(-18 -44)"><g class="fl" style="--d:.5s"><use href="#flower" transform="scale(.95)"/></g></g>
 <g transform="translate(18 -44)"><g class="fl" style="--d:.65s"><use href="#flower" transform="scale(.95)"/></g></g>
 <g transform="translate(0 -62)"><g class="fl" style="--d:.8s"><use href="#flower" transform="scale(1.05)"/></g></g>
 <g transform="translate(-30 -22)"><g class="fl" style="--d:.95s"><use href="#flower" transform="scale(.8)"/></g></g>
 <g transform="translate(30 -22)"><g class="fl" style="--d:1.1s"><use href="#flower" transform="scale(.8)"/></g></g>
 <g transform="translate(0 -30)"><g class="fl" style="--d:1.25s"><use href="#flower" transform="scale(.9)"/></g></g>
 <path d="M-30 -10L0 42 30 -10z" fill="#f7eedd" stroke="#e2d3b0" stroke-width="1.5" stroke-linejoin="round"/>
 <path d="M-30 -10L0 42 30 -10z" fill="#e97b8b" opacity=".35" transform="scale(.6) translate(0 -6)"/>
 <circle r="6" cx="0" cy="30" fill="#ffc82e" opacity="0"/>
 <path d="M-9 20h18" stroke="#e97b8b" stroke-width="4" stroke-linecap="round"/>
</g>
<!-- mano de la mujer sobre el ramo -->
<circle cx="240" cy="320" r="7.5" fill="#f0cfb2" opacity="0"/>
</svg>
<div class="msg" id="msg"><span class="a">Toca para entregar el ramo</span><span class="b">Para ti, Deneb</span></div>
</button>

<script>
const scene=document.getElementById('scene'),msg=document.getElementById('msg');
let opened=false;
function petals(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<28;i++){const p=document.createElement('div');p.className='p';
    p.style.left=Math.random()*100+'vw';p.style.animationDuration=(3+Math.random()*3)+'s';
    p.style.animationDelay=(1+Math.random()*1.8)+'s';p.style.transform='scale('+(.6+Math.random()*.9)+')';
    document.body.appendChild(p);setTimeout(()=>p.remove(),8500);}
}
scene.addEventListener('click',()=>{
  opened=!opened;
  scene.classList.toggle('on-scene',opened);msg.classList.toggle('on',opened);
  if(opened)petals();
  msg.firstChild.textContent;
  msg.querySelector('.a').textContent=opened?'Toca para volver a empezar':'Toca para entregar el ramo';
});
</script>
